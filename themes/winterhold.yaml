        radial-gradient(ellipse at top, #f1ebd8 0%, #e9e2d0 55%, #ddd5bf 100%) fixed

      # Cards: MUST stay a plain color. HA charts read --ha-card-background as a color (label outline)
      # and as their own background; gradients here break chart labels. Decor lives in box-shadow + card-mod.
      ha-card-background: "#f4eedd"
      ha-card-border-color: *l-divider
      # Layers: gold top rule, drop shadow, inner gold hairline framed 3px in (double rule), soft aged inner edge
      ha-card-box-shadow: "inset 0 2px 0 0 #7d5f26, inset 0 -2px 0 0 rgba(110,85,40,0.22), 0 2px 8px rgba(80,62,28,0.18), 0 5px 12px -6px rgba(90,60,30,0.22), inset 0 0 0 3px #f4eedd, inset 0 0 0 4px rgba(125,95,38,0.35), inset 0 0 22px rgba(125,95,38,0.12)"
      ha-card-header-color: "#5e4719"

      # Header / toolbar / tabs
      app-header-background-color: "#ddd5bf"
      app-header-text-color: *l-text
      app-header-selection-bar-color: *l-primary
      paper-tabs-selection-bar-color: *l-primary

      # Sidebar
      sidebar-background-color: "#ddd5bf"
      sidebar-icon-color: *l-text2
      sidebar-text-color: *l-text2
      sidebar-selected-background-color: "rgba(125,95,38,0.14)"
      sidebar-selected-icon-color: *l-primary
      sidebar-selected-text-color: "#5e4719"

      # HA primary scale (light): gold ramp, dark to light. Buttons, switches and other primary fills derive from it.
      ha-color-primary-05: "#2a2418"
      ha-color-primary-10: "#362d1c"
      ha-color-primary-20: "#4a3b1f"
      ha-color-primary-30: "#5e4719"
      ha-color-primary-40: "#7d5f26"
      ha-color-primary-50: "#a98544"
      ha-color-primary-60: "#b08d4f"
      ha-color-primary-70: "#d1b277"
      ha-color-primary-80: "#ddd5bf"
      ha-color-primary-90: "#e9e2d0"
      ha-color-primary-95: "#f4eedd"

      # HA neutral scale (light): 95 form fields/surfaces, 90 hover, 80 disabled fill, 05 text
      ha-color-neutral-05: "#1c1f1a"
      ha-color-neutral-10: "#262b24"
      ha-color-neutral-20: "#2f352c"
      ha-color-neutral-30: "#3a4036"
      ha-color-neutral-40: "#4a5045"
      ha-color-neutral-50: "#6b6757"
      ha-color-neutral-60: "#a39d88"
      ha-color-neutral-70: "#bdb597"
      ha-color-neutral-80: "#cbbf9f"
      ha-color-neutral-90: "#ddd5bf"
      ha-color-neutral-95: "#ece4cf"

      # Semantic
      error-color: "#9a3b2e"
      warning-color: "#a97618"
      success-color: "#55703a"
      info-color: "#4a7189"
      label-badge-red: "#9a3b2e"
      label-badge-green: "#55703a"
      label-badge-blue: "#4a7189"
      label-badge-yellow: "#a97618"
      label-badge-grey: "#9c967f"

      # Entity state colors
      state-icon-color: *l-text2
      state-icon-active-color: *l-primary
      state-icon-unavailable-color: "#9c967f"
      state-light-active-color: "#c48a12"
      state-switch-active-color: *l-primary         # matches the toggle
      state-fan-active-color: "#4a7189"
      state-cover-active-color: "#7d5f26"
      state-media_player-active-color: "#6c5290"
      state-lock-locked-color: "#55703a"
      state-lock-unlocked-color: "#a97618"
      state-lock-jammed-color: "#9a3b2e"
      state-climate-heat-color: "#b4571f"
      state-climate-cool-color: "#4a7189"
      state-climate-auto-color: "#55703a"
      state-climate-dry-color: "#a97618"
      state-climate-fan_only-color: "#4a7189"
      state-climate-off-color: "#9c967f"
      state-person-home-color: "#55703a"
      state-person-zone-color: "#a97618"
      state-person-not_home-color: "#9c967f"
      state-binary_sensor-active-color: "#a97618"
      state-alert-on-color: "#9a3b2e"
      state-sun-day-color: "#c48a12"
      state-sun-night-color: "#6c5290"

      # Switches
      switch-checked-color: *l-primary
      switch-checked-button-color: "#f4eedd"
      switch-checked-track-color: "#a98544"
      ha-switch-checked-border-color: *l-primary
      switch-unchecked-color: "#9c967f"
      switch-unchecked-button-color: "#f4eedd"
      switch-unchecked-track-color: "#bdb597"

      # Sliders
      slider-color: *l-primary
      slider-bar-color: "#cbbf9f"
      slider-secondary-color: "#a98544"

      # Inputs, lists, menus
      input-fill-color: "#ece4cf"
      input-ink-color: *l-text
      input-label-ink-color: *l-text2
      input-disabled-ink-color: "#9c967f"
      input-idle-line-color: "#bdb597"
      input-hover-line-color: "#9c967f"
      input-dropdown-icon-color: *l-text2
      paper-listbox-background-color: "#f4eedd"
      paper-item-icon-color: *l-text2
      paper-item-icon-active-color: *l-primary
      mdc-theme-primary: *l-primary
      mdc-theme-secondary: *l-accent
      mdc-theme-surface: *l-card
      mdc-theme-on-surface: *l-text
      mdc-theme-on-primary: "#f4eedd"
      mdc-ripple-color: "#7d5f26"
      mdc-select-fill-color: "#ece4cf"
      mdc-text-field-fill-color: "#ece4cf"
      mdc-select-ink-color: *l-text
      mdc-text-field-ink-color: *l-text

      # Dialogs
      mdc-dialog-heading-ink-color: "#5e4719"
      mdc-dialog-content-ink-color: *l-text
      dialog-backdrop-filter: "brightness(70%) blur(4px)"
      ha-dialog-scrim-backdrop-filter: "brightness(70%) blur(4px)"
      mdc-dialog-scrim-color: "rgba(72,50,24,0.58)"  # warm candle-lit umber

      # Tables, code, markdown
      table-header-background-color: "#ece4cf"
      table-row-background-color: *l-card
      table-row-alternative-background-color: "#efe8d5"
      code-editor-background-color: "#efe8d5"
      markdown-code-background-color: "#e2dac4"
      codemirror-keyword: "#a97618"
      codemirror-operator: "#b4571f"
      codemirror-variable: "#4a7189"
      codemirror-variable-2: "#55703a"
      codemirror-variable-3: "#6c5290"
      codemirror-builtin: "#7d5f26"
      codemirror-atom: "#6c5290"
      codemirror-number: "#b4571f"
      codemirror-string: "#55703a"
      codemirror-comment: "#9c967f"
      codemirror-meta: "#6b6757"
      codemirror-property: "#8a6a2f"
      codemirror-tag: "#9a3b2e"
      codemirror-attribute: "#a97618"
      scrollbar-thumb-color: "#a98544"

      # Energy dashboard
      energy-solar-color: "#c48a12"
      energy-grid-consumption-color: "#4a7189"
      energy-grid-return-color: "#55703a"
      energy-battery-out-color: "#6c5290"
      energy-battery-in-color: "#b4571f"
      energy-gas-color: "#b4571f"
      energy-water-color: "#4a7189"

      # History/line graph series: palette colors (frost, ember, moss, arcane, amber, red, gold, ...)
      graph-color-1: "#4a7189"
      graph-color-2: "#b4571f"
      graph-color-3: "#55703a"
      graph-color-4: "#6c5290"
      graph-color-5: "#a97618"
      graph-color-6: "#9a3b2e"
      graph-color-7: "#7d5f26"
      graph-color-8: "#6b6757"
      graph-color-9: "#556b3f"
      graph-color-10: "#c48a12"
