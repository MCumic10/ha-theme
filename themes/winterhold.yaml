Winterhold:
  primary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  secondary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-common-base_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-body1_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-headline_-_font-family: "Cinzel, 'Trajan Pro', Georgia, 'Palatino Linotype', serif"
  ha-font-family-body: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  ha-font-family-heading: "Cinzel, 'Trajan Pro', Georgia, 'Palatino Linotype', serif"
  ha-font-family-longform: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  ha-card-header-font-family: "Cinzel, 'Trajan Pro', Georgia, 'Palatino Linotype', serif"
  ha-card-header-font-size: 20px
  ha-card-header-font-weight: "600"

  ha-card-border-radius: 4px
  ha-card-border-width: 1px
  ha-button-border-radius: 3px
  ha-dialog-border-radius: 6px
  ha-bottom-sheet-border-radius: 6px
  ha-tooltip-border-radius: 3px
  switch-track-border-radius: 4px
  mdc-shape-medium: 4px
  mdc-shape-small: 2px
  mdc-shape-large: 6px

  card-mod-theme: Winterhold
  card-mod-card-yaml: |
    .: |
      ha-card::before {
        content: "";
        position: absolute;
        inset: 4px;
        pointer-events: none;
        opacity: 0.75;
        background:
          linear-gradient(var(--primary-color), var(--primary-color)) top left / 14px 1px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) top left / 1px 14px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) top right / 14px 1px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) top right / 1px 14px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) bottom left / 14px 1px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) bottom left / 1px 14px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) bottom right / 14px 1px no-repeat,
          linear-gradient(var(--primary-color), var(--primary-color)) bottom right / 1px 14px no-repeat;
      }
      .card-header {
        position: relative;
      }
      .card-header::after {
        content: "\25C6";
        position: absolute;
        left: 12px;
        bottom: 2px;
        font-size: 8px;
        line-height: 1;
        color: var(--primary-color);
      }
      ha-card.active ha-tile-icon {
        filter: drop-shadow(0 0 5px color-mix(in srgb, var(--tile-color) 55%, transparent));
        transition: filter 0.3s ease;
      }
      ha-tile-icon[data-domain="light"][data-state="on"] {
        filter: drop-shadow(0 0 9px color-mix(in srgb, var(--tile-color) 75%, transparent));
      }
      @keyframes nf-ember-pulse {
        0%, 100% { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tile-color) 45%, transparent)); }
        50%      { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--tile-color) 85%, transparent)); }
      }
      @media (prefers-reduced-motion: no-preference) {
        ha-tile-icon[data-domain="climate"][data-state="heat"] {
          animation: nf-ember-pulse 3s ease-in-out infinite;
        }
      }
      @keyframes nf-candle {
        0%   { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--tile-color) 70%, transparent)); }
        14%  { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--tile-color) 80%, transparent)); }
        27%  { filter: drop-shadow(0 0 7px color-mix(in srgb, var(--tile-color) 62%, transparent)); }
        41%  { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--tile-color) 76%, transparent)); }
        58%  { filter: drop-shadow(0 0 11px color-mix(in srgb, var(--tile-color) 82%, transparent)); }
        73%  { filter: drop-shadow(0 0 7px color-mix(in srgb, var(--tile-color) 64%, transparent)); }
        89%  { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--tile-color) 74%, transparent)); }
        100% { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--tile-color) 70%, transparent)); }
      }
      @keyframes nf-frost {
        0%, 100% { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tile-color) 40%, transparent)); }
        50%      { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--tile-color) 75%, transparent)); }
      }
      @keyframes nf-arcane {
        0%, 100% { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--tile-color) 50%, transparent)) hue-rotate(0deg); }
        50%      { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--tile-color) 80%, transparent)) hue-rotate(-18deg); }
      }
      @keyframes nf-alert {
        0%, 100% { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tile-color) 50%, transparent)); }
        50%      { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--tile-color) 90%, transparent)); }
      }
      @media (prefers-reduced-motion: no-preference) {
        ha-tile-icon[data-domain="light"][data-state="on"] {
          animation: nf-candle 5.3s ease-in-out infinite;
        }
        ha-tile-icon[data-domain="climate"][data-state="cool"] {
          animation: nf-frost 4s ease-in-out infinite;
        }
        ha-tile-icon[data-domain="media_player"][data-state="playing"] {
          animation: nf-arcane 4.5s ease-in-out infinite;
        }
        ha-tile-icon[data-domain="alert"][data-state="on"] {
          animation: nf-alert 2.4s ease-in-out infinite;
        }
      }
      ha-tile-icon[data-domain="lock"][data-state="locked"] {
        filter: drop-shadow(0 0 6px color-mix(in srgb, var(--tile-color) 55%, transparent));
      }
      ha-tile-icon[data-domain="lock"][data-state="unlocked"] {
        filter: drop-shadow(0 0 8px color-mix(in srgb, var(--tile-color) 75%, transparent));
      }
      ha-card:has(ha-tile-icon[data-domain="lock"][data-state="unlocked"]) {
        border-color: var(--warning-color);
      }
      ha-card.active {
        box-shadow: var(--ha-card-box-shadow), inset 0 0 18px color-mix(in srgb, var(--tile-color) 14%, transparent);
      }
      .entity:hover {
        background-color: rgba(var(--rgb-primary-color), 0.07);
        border-radius: 3px;
      }
      ha-card {
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }
      ha-card:hover {
        border-color: var(--primary-color);
      }
      #states > *:not(:last-child) {
        background: linear-gradient(to right, transparent, rgba(var(--rgb-primary-color), 0.45), transparent) bottom / 100% 1px no-repeat;
      }
      #states > *:hover {
        background-color: rgba(var(--rgb-primary-color), 0.07);
      }
      .card-header::before {
        content: "\2756";
        color: var(--primary-color);
        font-size: 0.6em;
        margin-right: 0.6em;
        vertical-align: 0.15em;
        opacity: 0.8;
      }
      .card-header {
        font-variant: small-caps;
        letter-spacing: 0.08em;
        padding-bottom: 14px;
        background:
          linear-gradient(to right, var(--primary-color), rgba(var(--rgb-primary-color), 0)) left 16px bottom 6px / calc(100% - 32px) 1px no-repeat;
      }
    ha-markdown$: |
      p:first-of-type::first-letter {
        float: left;
        font-family: Cinzel, 'Trajan Pro', Georgia, serif;
        font-size: 2.6em;
        line-height: 0.85;
        padding: 0.04em 0.1em 0 0;
        color: var(--primary-color);
      }
  card-mod-root: |
    .header, app-header {
      border-bottom: 2px solid var(--primary-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      background-image:
        linear-gradient(to bottom, rgba(var(--rgb-primary-color), 0.08), transparent),
        repeating-linear-gradient(0deg, rgba(var(--rgb-primary-color), 0.03) 0 1px, transparent 1px 4px);
    }
    ha-tab[active] {
      background-image: linear-gradient(to bottom, transparent, rgba(var(--rgb-primary-color), 0.12));
    }
    ha-tab:focus-visible,
    ha-tab:focus {
      outline: 1px solid var(--primary-color);
      outline-offset: -2px;
      border-radius: 3px;
    }
  card-mod-sidebar: |
    :host {
      border-right: 2px solid var(--primary-color);
      background-image:
        linear-gradient(to bottom, rgba(var(--rgb-primary-color), 0.10), transparent 160px),
        repeating-linear-gradient(0deg, rgba(var(--rgb-primary-color), 0.03) 0 1px, transparent 1px 4px);
      box-shadow: inset -8px 0 12px -8px rgba(0, 0, 0, 0.25);
    }
    ha-list-item-button.selected {
      box-shadow: inset 3px 0 0 var(--primary-color), inset 0 1px 3px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
    }
    .title {
      font-variant: small-caps;
      letter-spacing: 0.06em;
      color: var(--sidebar-selected-text-color);
    }
    .divider {
      border-bottom: none !important;
      height: 1px;
      margin: 6px 12px;
      background: linear-gradient(to right, transparent, rgba(var(--rgb-primary-color), 0.6), transparent);
    }
  card-mod-more-info-yaml: |
    $: |
      .mdc-dialog .mdc-dialog__surface {
        border: 1px solid var(--divider-color);
        border-top: 2px solid var(--primary-color);
        box-shadow: inset 0 0 0 3px var(--card-background-color), inset 0 0 0 4px rgba(var(--rgb-primary-color), 0.35);
      }

