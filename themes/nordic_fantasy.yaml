# Nordic Fantasy - Home Assistant theme
# Natural, earthy fantasy palette (Elder Scrolls / Skyrim inspired):
# night forest, moss, weathered stone, parchment, aged gold, ember.
# Palette table lives in CLAUDE.md - keep in sync.
# Anchors (d-* dark, l-* light) are defined inline at first use.

Nordic Fantasy:
  # ================= Shared (both modes) =================
  # Typography: serif stack, available on Windows/macOS/Linux/Android/iOS
  primary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  secondary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-common-base_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-body1_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-headline_-_font-family: "Georgia, 'Palatino Linotype', serif"
  ha-card-header-font-family: "Georgia, 'Palatino Linotype', serif"
  ha-card-header-font-size: 20px
  ha-card-header-font-weight: "600"

  # Shape: carved-stone feel, near-square corners with thin borders
  ha-card-border-radius: 4px
  ha-card-border-width: 1px
  ha-button-border-radius: 3px
  ha-dialog-border-radius: 6px
  ha-bottom-sheet-border-radius: 6px
  ha-tooltip-border-radius: 3px
  switch-track-border-radius: 4px
  mdc-shape-medium: 4px
  mdc-shape-small: 2px
  mdc-shape-large: 6px

  # HA design-token scale: buttons, switches and other "primary" fills derive from --ha-color-primary-NN
  # (default blue). Gold ramp, dark to light; same in both modes (HA picks the index per mode).
  ha-color-primary-05: "#2a2418"
  ha-color-primary-10: "#362d1c"
  ha-color-primary-20: "#4a3b1f"
  ha-color-primary-30: "#5e4719"
  ha-color-primary-40: "#7d5f26"
  ha-color-primary-50: "#a98544"
  ha-color-primary-60: "#b08d4f"
  ha-color-primary-70: "#d1b277"
  ha-color-primary-80: "#ddd5bf"
  ha-color-primary-90: "#e9e2d0"
  ha-color-primary-95: "#f4eedd"

  # ================= card-mod (requires card-mod from HACS) =================
  # Ignored by Home Assistant if card-mod is not installed.
  # Uses theme variables only, so it follows light/dark automatically.
  card-mod-card: |
    /* Tile cards (HA sets ha-card.active and data-domain/data-state on ha-tile-icon):
       active icons glow in their state color (candlelight lights, ember heat, frost cooling, moss switches) */
    ha-card.active ha-tile-icon {
      filter: drop-shadow(0 0 5px color-mix(in srgb, var(--tile-color) 55%, transparent));
      transition: filter 0.3s ease;
    }
    ha-tile-icon[data-domain="light"][data-state="on"] {
      filter: drop-shadow(0 0 9px color-mix(in srgb, var(--tile-color) 75%, transparent));
    }
    /* Heating climate: slow ember pulse (skipped when the user prefers reduced motion) */
    @keyframes nf-ember-pulse {
      0%, 100% { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tile-color) 45%, transparent)); }
      50%      { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--tile-color) 85%, transparent)); }
    }
    @media (prefers-reduced-motion: no-preference) {
      ha-tile-icon[data-domain="climate"][data-state="heat"] {
        animation: nf-ember-pulse 3s ease-in-out infinite;
      }
    }
    /* Hover: card border lights up gold; entity rows get a faint gold wash */
    ha-card {
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    ha-card:hover {
      border-color: var(--primary-color);
    }
    /* Row dividers: gold hairline fading out at both ends (entities-style cards) */
    #states > *:not(:last-child) {
      background: linear-gradient(to right, transparent, rgba(var(--rgb-primary-color), 0.45), transparent) bottom / 100% 1px no-repeat;
    }
    #states > *:hover {
      background-color: rgba(var(--rgb-primary-color), 0.07);
    }
    /* Card titles: small caps + gold rule that fades out to the right */
    .card-header {
      font-variant: small-caps;
      letter-spacing: 0.08em;
      padding-bottom: 14px;
      background:
        linear-gradient(to right, var(--primary-color), rgba(var(--rgb-primary-color), 0)) left 16px bottom 6px / calc(100% - 32px) 1px no-repeat;
    }
  card-mod-root: |
    .header, app-header {
      border-bottom: 2px solid var(--primary-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      background-image:
        linear-gradient(to bottom, rgba(var(--rgb-primary-color), 0.08), transparent),
        repeating-linear-gradient(0deg, rgba(var(--rgb-primary-color), 0.03) 0 1px, transparent 1px 4px);
    }
    /* Active tab: soft pressed-in wash under the gold underline */
    ha-tab[active] {
      background-image: linear-gradient(to bottom, transparent, rgba(var(--rgb-primary-color), 0.12));
    }
    /* Focus ring: gold instead of the browser default grey (best effort; ha-tab sets no focus style) */
    ha-tab:focus-visible,
    ha-tab:focus {
      outline: 1px solid var(--primary-color);
      outline-offset: -2px;
      border-radius: 3px;
    }
  card-mod-sidebar: |
    :host {
      border-right: 2px solid var(--primary-color);
      background-image:
        linear-gradient(to bottom, rgba(var(--rgb-primary-color), 0.10), transparent 160px),
        repeating-linear-gradient(0deg, rgba(var(--rgb-primary-color), 0.03) 0 1px, transparent 1px 4px);
      box-shadow: inset -8px 0 12px -8px rgba(0, 0, 0, 0.25);
    }
    /* Selected item: gold bar on the left edge and a slight engraved inset */
    ha-list-item-button.selected {
      box-shadow: inset 3px 0 0 var(--primary-color), inset 0 1px 3px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
    }
    .title {
      font-variant: small-caps;
      letter-spacing: 0.12em;
      color: var(--sidebar-selected-text-color);
    }
  card-mod-more-info: |
    $: |
      .mdc-dialog .mdc-dialog__surface {
        border: 1px solid var(--divider-color);
        border-top: 2px solid var(--primary-color);
      }

  modes:
    # ===================== DARK =====================
    dark:
      # Core
      primary-color: &d-primary "#c9a45c"           # bronze
      dark-primary-color: "#9a7d3e"
      light-primary-color: "#dfc388"
      accent-color: &d-accent "#5fa39b"             # teal
      text-primary-color: "#111716"                 # text on bronze fills
      primary-background-color: &d-bg "#111716"     # deep teal-black
      secondary-background-color: &d-card "#1a2321" # dark slate teal
      card-background-color: *d-card
      primary-text-color: &d-text "#dce6e1"
      secondary-text-color: &d-text2 "#8fa39b"
      disabled-text-color: "#5f706a"
      disabled-color: "#3f4e49"
      divider-color: &d-divider "#2e3b38"
      outline-color: *d-divider
      rgb-primary-color: "201, 164, 92"
      rgb-accent-color: "95, 163, 155"
      rgb-primary-text-color: "220, 230, 225"
      rgb-secondary-text-color: "143, 163, 155"
      rgb-card-background-color: "26, 35, 33"
      rgb-primary-background-color: "17, 23, 22"

      # Background: Blackreach, deep teal-black with a faint teal glow
      # Layers (top to bottom): edge vignette, faint teal/bronze blotches, faint lines, base gradient.
      # Pure CSS gradients, same structure as light mode.
      lovelace-background: >-
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.4) 100%) fixed,
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(95, 163, 155, 0.07), transparent 70%) fixed,
        radial-gradient(ellipse 50% 45% at 85% 70%, rgba(201, 164, 92, 0.05), transparent 70%) fixed,
        radial-gradient(ellipse 40% 30% at 55% 95%, rgba(95, 163, 155, 0.05), transparent 70%) fixed,
        repeating-linear-gradient(0deg, rgba(220, 230, 225, 0.02) 0 1px, transparent 1px 4px) fixed,
        radial-gradient(ellipse at top, #1c2a27 0%, #111716 55%, #0b100f 100%) fixed

      # Cards: ha-card-background MUST stay a plain color (HA charts read it as a color).
      # Layers: gold top rule, drop shadow, inner gold hairline 3px in (double rule), soft dark inner edge
      ha-card-background: "#1a2321"
      ha-card-border-color: *d-divider
      ha-card-box-shadow: "inset 0 2px 0 0 #c9a45c, 0 3px 10px rgba(0,0,0,0.45), inset 0 0 0 3px #1a2321, inset 0 0 0 4px rgba(201,164,92,0.35), inset 0 0 22px rgba(0,0,0,0.25)"
      ha-card-header-color: "#dfc388"

      # Header / toolbar / tabs
      app-header-background-color: "#161e1c"
      app-header-text-color: *d-text
      app-header-selection-bar-color: *d-primary
      paper-tabs-selection-bar-color: *d-primary

      # Sidebar
      sidebar-background-color: "#0d1211"
      sidebar-icon-color: *d-text2
      sidebar-text-color: *d-text2
      sidebar-selected-background-color: "rgba(201,164,92,0.14)"
      sidebar-selected-icon-color: *d-primary
      sidebar-selected-text-color: "#dfc388"

      # HA neutral scale (dark): 05/10 surfaces, 80 secondary text, 95 primary text (see HA semantic tokens)
      ha-color-neutral-05: "#111716"
      ha-color-neutral-10: "#1a2321"
      ha-color-neutral-20: "#232e2b"
      ha-color-neutral-30: "#2e3b38"
      ha-color-neutral-40: "#3f4e49"
      ha-color-neutral-50: "#5f706a"
      ha-color-neutral-60: "#6f817a"
      ha-color-neutral-70: "#7f928a"
      ha-color-neutral-80: "#8fa39b"
      ha-color-neutral-90: "#c3d0ca"
      ha-color-neutral-95: "#dce6e1"

      # Semantic
