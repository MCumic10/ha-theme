      text-primary-color: "#1c1f1a"                 # text on gold fills
      primary-background-color: &d-bg "#1c1f1a"     # night forest
      secondary-background-color: &d-card "#262b24" # mossy stone
      card-background-color: *d-card
      primary-text-color: &d-text "#e6dfc9"
      secondary-text-color: &d-text2 "#a39d88"
      disabled-text-color: "#6b6f62"
      disabled-color: "#4a5045"
      divider-color: &d-divider "#3a4036"
      outline-color: *d-divider
      rgb-primary-color: "176, 141, 79"
      rgb-accent-color: "111, 143, 90"
      rgb-primary-text-color: "230, 223, 201"
      rgb-secondary-text-color: "163, 157, 136"
      rgb-card-background-color: "38, 43, 36"
      rgb-primary-background-color: "28, 31, 26"

      # Background: soft forest-light gradient behind dashboards
      lovelace-background: "radial-gradient(ellipse at top, #2a3326 0%, #1c1f1a 55%, #141612 100%) fixed"

      # Cards (same top tint as before, now via variable so light mode can layer grain)
      ha-card-background: "linear-gradient(#b08d4f, #b08d4f) top left / 100% 2px no-repeat, linear-gradient(#b08d4f, #b08d4f) left 3px top 3px / 14px 2px no-repeat, linear-gradient(#b08d4f, #b08d4f) left 3px top 3px / 2px 14px no-repeat, linear-gradient(#b08d4f, #b08d4f) right 3px top 3px / 14px 2px no-repeat, linear-gradient(#b08d4f, #b08d4f) right 3px top 3px / 2px 14px no-repeat, linear-gradient(#b08d4f, #b08d4f) left 3px bottom 3px / 14px 2px no-repeat, linear-gradient(#b08d4f, #b08d4f) left 3px bottom 3px / 2px 14px no-repeat, linear-gradient(#b08d4f, #b08d4f) right 3px bottom 3px / 14px 2px no-repeat, linear-gradient(#b08d4f, #b08d4f) right 3px bottom 3px / 2px 14px no-repeat, linear-gradient(to bottom, rgba(176, 141, 79, 0.08), transparent 70px), #262b24"
      ha-card-border-color: *d-divider
      ha-card-box-shadow: "0 3px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(230,223,201,0.04)"
      ha-card-header-color: "#d1b277"

      # Header / toolbar / tabs
