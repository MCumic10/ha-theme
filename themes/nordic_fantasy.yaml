      # Layers: drop shadow, inner gold hairline framed 3px in (double rule), soft aged inner edge
      ha-card-box-shadow: "0 2px 8px rgba(80,62,28,0.18), inset 0 0 0 3px #f4eedd, inset 0 0 0 4px rgba(125,95,38,0.35), inset 0 0 22px rgba(125,95,38,0.12)"
