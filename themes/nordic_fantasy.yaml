# Nordic Fantasy - Home Assistant theme
# Natural, earthy fantasy palette (Elder Scrolls / Skyrim inspired):
# weathered stone, slate, oxblood, dark leather brown, tan.
# Palette table lives in CLAUDE.md - keep in sync.
# Anchors (d-* dark, l-* light) are defined inline at first use.

Nordic Fantasy:
  # ================= Shared (both modes) =================
  # Typography: serif stack, available on Windows/macOS/Linux/Android/iOS
  primary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  secondary-font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-common-base_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-body1_-_font-family: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
  paper-font-headline_-_font-family: "Georgia, 'Palatino Linotype', serif"
  ha-card-header-font-family: "Georgia, 'Palatino Linotype', serif"
  ha-card-header-font-size: 20px
  ha-card-header-font-weight: "600"

  # Shape: carved-stone feel, near-square corners with thin borders
  ha-card-border-radius: 4px
  ha-card-border-width: 1px
  ha-button-border-radius: 3px
  ha-dialog-border-radius: 6px
  ha-bottom-sheet-border-radius: 6px
  ha-tooltip-border-radius: 3px
  switch-track-border-radius: 4px
  mdc-shape-medium: 4px
  mdc-shape-small: 2px
  mdc-shape-large: 6px

  # ================= card-mod (requires card-mod from HACS) =================
  # Ignored by Home Assistant if card-mod is not installed.
  # Uses theme variables only, so it follows light/dark automatically.
  card-mod-card: |
    ha-card {
      border-top: 2px solid var(--primary-color);
      background-image: linear-gradient(to bottom, rgba(var(--rgb-primary-color), 0.08), transparent 70px);
    }
    .card-header {
      font-variant: small-caps;
      letter-spacing: 0.08em;
    }
  card-mod-root: |
    .header, app-header {
      border-bottom: 2px solid var(--primary-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
  card-mod-sidebar: |
    :host {
      border-right: 2px solid var(--primary-color);
    }
    .title {
      font-variant: small-caps;
      letter-spacing: 0.12em;
      color: var(--sidebar-selected-text-color);
    }
  card-mod-more-info: |
    $: |
      .mdc-dialog .mdc-dialog__surface {
        border: 1px solid var(--divider-color);
        border-top: 2px solid var(--primary-color);
      }

  modes:
    # ===================== DARK =====================
    # Base palette: #34221b brown, #552a24 oxblood, #4c5059 slate, #555c5e stone, #806653 tan
    dark:
      # Core
      primary-color: &d-primary "#a58468"           # tan, lifted for contrast
      dark-primary-color: "#806653"
      light-primary-color: "#c2a68c"
      accent-color: &d-accent "#8c9699"             # stone
      text-primary-color: "#1f130e"                 # text on tan fills
      primary-background-color: &d-bg "#2a1c16"
      secondary-background-color: &d-card "#34221b" # dark brown
      card-background-color: *d-card
      primary-text-color: &d-text "#ebe3d8"
      secondary-text-color: &d-text2 "#b3a699"
      disabled-text-color: "#7a6f66"
      disabled-color: "#554a42"
      divider-color: &d-divider "#555c5e"           # stone
      outline-color: *d-divider
      rgb-primary-color: "165, 132, 104"
      rgb-accent-color: "140, 150, 153"
      rgb-primary-text-color: "235, 227, 216"
      rgb-secondary-text-color: "179, 166, 153"
      rgb-card-background-color: "52, 34, 27"
      rgb-primary-background-color: "42, 28, 22"

      lovelace-background: "radial-gradient(ellipse at top, #3d2a22 0%, #2a1c16 55%, #1c110d 100%) fixed"

      # Cards
      ha-card-border-color: *d-divider
      ha-card-box-shadow: "0 3px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(235,227,216,0.05)"
      ha-card-header-color: "#d4b99f"

      # Header (oxblood) / tabs
      app-header-background-color: "#552a24"
      app-header-text-color: "#f0e8dc"
      app-header-selection-bar-color: "#d4b99f"
      paper-tabs-selection-bar-color: "#d4b99f"

      # Sidebar (slate)
      sidebar-background-color: "#4c5059"
      sidebar-icon-color: "#d5cec4"
      sidebar-text-color: "#d5cec4"
      sidebar-selected-background-color: "rgba(0,0,0,0.22)"
      sidebar-selected-icon-color: "#e6cbb0"
      sidebar-selected-text-color: "#e6cbb0"

      # Semantic
      error-color: "#bb5548"
      warning-color: "#d1a561"
      success-color: "#8fa57d"
      info-color: "#8aa3b8"
      label-badge-red: "#bb5548"
      label-badge-green: "#8fa57d"
      label-badge-blue: "#8aa3b8"
      label-badge-yellow: "#d1a561"
      label-badge-grey: "#7a6f66"

      # Entity state colors
      state-icon-color: *d-text2
      state-icon-active-color: *d-primary
      state-icon-unavailable-color: "#7a6f66"
      state-light-active-color: "#e6c487"
      state-switch-active-color: "#8fa57d"
      state-fan-active-color: "#8aa3b8"
      state-cover-active-color: "#a58468"
      state-media_player-active-color: "#a49fbd"
      state-lock-locked-color: "#8fa57d"
      state-lock-unlocked-color: "#d1a561"
      state-lock-jammed-color: "#bb5548"
      state-climate-heat-color: "#cf7344"
      state-climate-cool-color: "#8aa3b8"
      state-climate-auto-color: "#8fa57d"
      state-climate-dry-color: "#d1a561"
      state-climate-fan_only-color: "#8aa3b8"
      state-climate-off-color: "#7a6f66"
      state-person-home-color: "#8fa57d"
      state-person-zone-color: "#d1a561"
      state-person-not_home-color: "#7a6f66"
      state-binary_sensor-active-color: "#d1a561"
      state-alert-on-color: "#bb5548"
      state-sun-day-color: "#e6c487"
      state-sun-night-color: "#a49fbd"

      # Switches
      switch-checked-color: *d-primary
      switch-checked-button-color: "#d4b99f"
      switch-checked-track-color: "#806653"
      switch-unchecked-color: "#7a6f66"
      switch-unchecked-button-color: "#9a8f85"
      switch-unchecked-track-color: "#4a3a32"

      # Sliders
      slider-color: *d-primary
      slider-bar-color: "#554a42"
      slider-secondary-color: "#806653"

      # Inputs, lists, menus
      input-fill-color: "#3f2b23"
      input-ink-color: *d-text
      input-label-ink-color: *d-text2
      input-disabled-ink-color: "#7a6f66"
      input-idle-line-color: "#6a5f56"
      input-hover-line-color: "#8a7f75"
      input-dropdown-icon-color: *d-text2
      paper-listbox-background-color: "#3a271f"
      paper-item-icon-color: *d-text2
      paper-item-icon-active-color: *d-primary
      mdc-theme-primary: *d-primary
      mdc-theme-secondary: *d-accent
      mdc-theme-surface: *d-card
      mdc-theme-on-surface: *d-text
      mdc-theme-on-primary: "#1f130e"
      mdc-ripple-color: "#a58468"
      mdc-select-fill-color: "#3f2b23"
      mdc-text-field-fill-color: "#3f2b23"
      mdc-select-ink-color: *d-text
      mdc-text-field-ink-color: *d-text

      # Dialogs
      mdc-dialog-heading-ink-color: "#d4b99f"
      mdc-dialog-content-ink-color: *d-text
      dialog-backdrop-filter: "brightness(55%) blur(4px)"
      ha-dialog-scrim-backdrop-filter: "brightness(55%) blur(4px)"
      mdc-dialog-scrim-color: "rgba(20,12,9,0.7)"

      # Tables, code, markdown
      table-header-background-color: "#3f2b23"
      table-row-background-color: *d-card
      table-row-alternative-background-color: "#2f201a"
      code-editor-background-color: "#1f1410"
      markdown-code-background-color: "#1f1410"
      codemirror-keyword: "#d1a561"
      codemirror-operator: "#cf7344"
      codemirror-variable: "#8aa3b8"
      codemirror-variable-2: "#8fa57d"
      codemirror-variable-3: "#a49fbd"
      codemirror-builtin: "#a58468"
      codemirror-atom: "#a49fbd"
      codemirror-number: "#cf7344"
      codemirror-string: "#8fa57d"
      codemirror-comment: "#7a6f66"
      codemirror-meta: "#b3a699"
      codemirror-property: "#e6c487"
      codemirror-tag: "#bb5548"
      codemirror-attribute: "#d1a561"
      scrollbar-thumb-color: "#554a42"

      # Energy dashboard
      energy-solar-color: "#e6c487"
      energy-grid-consumption-color: "#8aa3b8"
      energy-grid-return-color: "#8fa57d"
      energy-battery-out-color: "#a49fbd"
      energy-battery-in-color: "#cf7344"
      energy-gas-color: "#cf7344"
      energy-water-color: "#8aa3b8"

