      warning-color: "#d6a043"                      # amber
      success-color: "#7a9a56"                      # spring moss
      info-color: "#7fa3b5"                         # frost
      label-badge-red: "#d96c55"
      label-badge-green: "#7a9a56"
      label-badge-blue: "#7fa3b5"
